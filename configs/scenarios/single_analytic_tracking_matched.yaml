schema_version: 1
scenario:
  name: single_analytic_tracking_matched
  assembly_config_path: ../robots/assemblies/single_spatial.yaml
  low_level_control_path: ../control/mujoco_tracking_low_level.yaml
  backend:
    type: analytic
  scene: {}
  task:
    type: tracking
    waypoint_tolerance_m: 0.003
    target_advance_mode: tolerance
    loop: false
    tracking_control:
      approach_samples: 40
      approach_duration_s: 20.0
      tracking_mode: time
      trajectory_duration_s: 80.0
      time_parameterization: arc_length
      trajectory_interpolation: corner_stop_hermite
      reference_governor_enabled: true
      reference_error_slow_m: 0.003
      reference_error_stop_m: 0.010
      reference_lead_slow_ratio: 0.60
      reference_lead_stop_ratio: 0.90
      reference_scale_recovery_per_s: 1.0
    trajectory:
      type: square
      samples: 80
      closed: true
      radius_m: 0.018
      placement:
        center_mode: straight_tip_xy
        z_mode: straight_tip_minus_radius
        plane: xy
        yaw_deg: 15.0
      shape:
        side_length_m: 0.040
  runtime:
    controller_dt_s: 0.02
    n_substeps: 20
    max_steps: 9000
  hooks:
    recorder: true
    tendon_debug: true
    tendon_debug_stride: 5
    viewer: none
    keep_viewer_open: false
  artifacts:
    enabled: true
    save_npz: true
    save_plots: true
    save_gif: false
