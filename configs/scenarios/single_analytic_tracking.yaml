schema_version: 1
scenario:
  name: single_analytic_tracking
  assembly_config_path: ../robots/assemblies/single_spatial.yaml
  backend:
    type: analytic
  scene: {}
  task:
    type: tracking
    waypoint_tolerance_m: 0.003
    target_advance_mode: tolerance
    loop: false
    trajectory:
      type: square
      samples: 24
      radius_m: 0.010
      placement:
        center_mode: straight_tip_xy
        z_mode: straight_tip_minus_radius
        plane: xy
        yaw_deg: 0.0
      shape:
        side_length_m: 0.020
  runtime:
    controller_dt_s: 0.02
    n_substeps: 1
    max_steps: 1000
  hooks:
    recorder: true
    tendon_debug: true
    tendon_debug_stride: 5
    viewer: matplotlib
    keep_viewer_open: true
  artifacts:
    video_stride: 20
