schema_version: 1
scenario:
  name: single_analytic_navigation
  assembly_config_path: ../robots/assemblies/single_spatial.yaml
  low_level_control_path: ../control/spatial_low_level.yaml
  backend:
    type: analytic
  scene:
    structured_config_path: ../scenes/rocket_nozzle_entry.yaml
  task:
    type: navigation
    waypoint_tolerance_m: 0.001
    min_clearance_m: 0.010
    terminate_on_clearance_violation: true
    loop: false
    waypoints_world:
      - [0.000, 0.000, 0.145]
      - [0.000, 0.015, 0.140]
      - [0.015, 0.015, 0.135]
      - [0.015, 0.000, 0.140]
  runtime:
    controller_dt_s: 0.02
    n_substeps: 1
    max_steps: 1200
  hooks:
    recorder: true
    tendon_debug: false
    viewer: matplotlib
    keep_viewer_open: true
  artifacts:
    enabled: true
    save_npz: true
    save_plots: true
    save_gif: true
