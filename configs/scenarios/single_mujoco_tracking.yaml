schema_version: 1
scenario:
  name: single_mujoco_tracking
  assembly_config_path: ../robots/assemblies/single_spatial.yaml
  low_level_control_path: ../control/mujoco_tracking_low_level.yaml
  backend:
    type: mujoco
    kinematics_mode: discrete_hinge
    mujoco_config_path: ../mujoco_dual.yaml
    source_xml_path: ../../assets/mujoco/dual_three_segment_arm_tendon_with_visuals_mobile_base.xml
    generated_xml_path: ../../output/generated/scenario_single_tracking.xml
    retain_arm: executor
  scene: {}
  task:
    type: tracking
    waypoint_tolerance_m: 0.003
    target_advance_mode: tolerance
    loop: false
    tracking_control:
      approach_samples: 5
      tracking_mode: waypoint #time
      max_steps_per_waypoint: 500
      feedforward_speed_mps: 0.0
      # trajectory_duration_s: 100.0
    trajectory:
      type: square
      samples: 20
      radius_m: 0.018
      placement:
        center_mode: straight_tip_xy
        z_mode: straight_tip_minus_radius
        plane: xy
        yaw_deg: 15.0
      shape:
        side_length_m: 0.040
  runtime:
    controller_dt_s: 0.02
    n_substeps: 20
    max_steps: 10000
  hooks:
    recorder: true
    tendon_debug: true
    tendon_debug_stride: 5
    show_live_tendon_panel: false
    live_tendon_panel_stride: 5
    show_live_diagnostics_panel: false
    live_diagnostics_panel_stride: 5
    viewer: none
    keep_viewer_open: false
  artifacts:
    mujoco_pcc_diagnostics_stride: 10
    save_gif: true
    save_mp4: true
    video_mode: live_mujoco
    video_fps: 10
    video_stride: 10
