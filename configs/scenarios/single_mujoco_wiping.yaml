schema_version: 1
scenario:
  name: single_mujoco_wiping
  assembly_config_path: ../robots/assemblies/single_spatial.yaml
  backend:
    type: mujoco
    mujoco_config_path: ../mujoco_dual.yaml
    source_xml_path: ../../assets/mujoco/dual_three_segment_arm_tendon_with_visuals_mobile_base.xml
    generated_xml_path: ../../output/generated/scenario_single_wiping.xml
    retain_arm: executor
  scene:
    structured_config_path: ../scenes/wiping_board.yaml
  task:
    type: wiping
    waypoint_tolerance_m: 0.003
    target_advance_mode: tolerance
    wiping_control_type: dynamic_adaptive_impedance
    feedback_mode: mujoco_actual
    normal_force_gain: 0.075
    target_normal_force_n: 1.5
    force_proxy_stiffness_n_m: 600.0
    target_contact_distance_m: -0.0025
    contact_tolerance_m: 0.002
    max_contact_force_n: 5.0
    contact_loss_tolerance_steps: 500
    wiping_path:
      surface_id: board_surface
      patch_id: center_patch
      line_count: 5
      samples_per_line: 30
      approach_offset_m: 0.005
      contact_offset_m: -0.0025
  runtime:
    controller_dt_s: 0.02
    n_substeps: 20
    max_steps: 2000
  hooks:
    recorder: true
    tendon_debug: true
    tendon_debug_stride: 5
    show_live_tendon_panel: true
    live_tendon_panel_stride: 5
    show_live_force_panel: false
    viewer: mujoco
    keep_viewer_open: true
