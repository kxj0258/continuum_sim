schema_version: 1
scenario:
  name: dual_analytic_wiping
  assembly_config_path: ../robots/assemblies/dual_spatial.yaml
  low_level_control_path: ../control/spatial_low_level.yaml
  backend:
    type: analytic
  scene:
    structured_config_path: ../scenes/wiping_board.yaml
  task:
    type: wiping
    waypoint_tolerance_m: 0.003
    observer_roi_world: [0.0375, 0.000, 0.095]
    surface_normal_world: [-1.0, 0.0, 0.0]
    target_contact_distance_m: 0.0
    contact_tolerance_m: 0.002
    force_strategy:
      type: contact_distance
    tracking_control:
      approach_samples: 30
      tracking_mode: time
      trajectory_duration_s: 20.0
    waypoints_world:
      - [0.0425, -0.020, 0.0825]
      - [0.0350, -0.020, 0.0825]
      - [0.0350, 0.020, 0.0825]
      - [0.0350, 0.020, 0.0950]
      - [0.0350, -0.020, 0.0950]
      - [0.0425, -0.020, 0.0950]
  runtime:
    controller_dt_s: 0.02
    n_substeps: 1
    max_steps: 2000
  hooks:
    recorder: true
    tendon_debug: false
    viewer: matplotlib
    keep_viewer_open: true
  artifacts:
    enabled: true
    save_npz: true
    save_plots: true
    save_gif: true
