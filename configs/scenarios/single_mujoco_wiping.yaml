schema_version: 1
scenario:
  name: single_mujoco_wiping
  assembly_config_path: ../robots/assemblies/single_spatial.yaml
  low_level_control_path: ../control/mujoco_tracking_low_level.yaml
  backend:
    type: mujoco
    kinematics_mode: discrete_hinge
    mujoco_config_path: ../mujoco_dual.yaml
    source_xml_path: ../../assets/mujoco/dual_three_segment_arm_tendon_with_visuals_mobile_base.xml
    generated_xml_path: ../../output/generated/scenario_single_wiping.xml
    retain_arm: executor
  scene:
    structured_config_path: ../scenes/wiping_board.yaml
  task:
    type: wiping
    waypoint_tolerance_m: 0.003
    target_advance_mode: tolerance
    # Optional admittance mode: set this and force_strategy.type to
    # contact_triggered_admittance. The parameters remain below so the
    # strategy can be switched without maintaining a second scenario file.
    wiping_control_type: dynamic_adaptive_impedance
    dynamics_config_path: ../dynamics/pcc_reduced.yaml
    force_strategy:
      type: dynamic_adaptive_impedance
    feedback_mode: mujoco_actual
    normal_force_gain: 0.075
    target_normal_force_n: 1.5
    force_proxy_stiffness_n_m: 600.0
    target_contact_distance_m: 0.0
    contact_tolerance_m: 0.002
    max_contact_force_n: 5.0
    contact_loss_tolerance_steps: 500
    admittance:
      target_normal_force_n: 1.5
      contact_force_threshold_n: 0.1
      tangent_tolerance_m: 0.001
      force_tolerance_n: 0.08
      stable_steps_required: 3
      max_steps_per_target: 80
      position_gain: 10.0
      kp_force: 0.5
      ki_force: 0.012
      admittance_mass: 1.0
      admittance_damping: 20.0
      admittance_stiffness: 5.0
      admittance_clip_m: 0.012
      force_deadband_n: 0.03
      force_filter_alpha: 0.1
      max_tangent_velocity_m_s: 0.012
      max_normal_velocity_m_s: 0.010
      enforce_velocity_limits: false
    tracking_control:
      approach_samples: 30
      tracking_mode: time
      trajectory_duration_s: 35.0
    wiping_path:
      surface_id: board_surface
      patch_id: center_patch
      line_count: 5
      samples_per_line: 30
      approach_offset_m: 0.005
      contact_offset_m: 0.0
  runtime:
    controller_dt_s: 0.02
    n_substeps: 20
    max_steps: 2000
  hooks:
    recorder: true
    tendon_debug: true
    tendon_debug_stride: 5
    show_live_tendon_panel: true
    live_tendon_panel_stride: 5
    show_live_force_panel: false
    show_live_diagnostics_panel: true
    live_diagnostics_panel_stride: 5
    viewer: mujoco
    keep_viewer_open: false
  artifacts:
    mujoco_pcc_diagnostics_stride: 10
    enabled: true
    save_npz: true
    save_plots: true
    save_gif: true
    video_mode: live_mujoco
    video_fps: 10
    video_stride: 10
