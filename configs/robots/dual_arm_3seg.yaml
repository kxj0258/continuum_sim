          index: 0
          length: 0.04
          flexure_length: 0.0365
          distal_straight_length: 0.0035
          flexure_joint_axes: [y, x, y, x]
          backbone_radius: 0.0075
          tendon_radius: 0.005
          collision_radius: 0.00625
          mass: 0.00989929
          bending_stiffness: 0.0002
          torsional_stiffness: 0.006
