schema_version: 1
scenario:
  name: single_mujoco_navigation
  assembly_config_path: ../robots/assemblies/single_spatial.yaml
  low_level_control_path: ../control/mujoco_tracking_low_level.yaml
  backend:
    type: mujoco
    kinematics_mode: discrete_hinge
    mujoco_config_path: ../mujoco_dual.yaml
    source_xml_path: ../../assets/mujoco/dual_three_segment_arm_tendon_with_visuals_mobile_base.xml
    generated_xml_path: ../../output/generated/scenario_single_navigation.xml
    retain_arm: executor
  scene:
    structured_config_path: ../scenes/rocket_nozzle_entry.yaml
  task:
    type: navigation
    waypoint_tolerance_m: 0.003
    target_advance_mode: tolerance
    min_clearance_m: 0.010
    terminate_on_clearance_violation: false
    tracking_control:
      approach_samples: 10
      tracking_mode: waypoint
      max_steps_per_waypoint: 300
      feedforward_speed_mps: 0.0
    mission:
      waypoint_ids:
        - entry_wall_30deg
        - rib_gap_center
        - throat_wall_210deg
  runtime:
    controller_dt_s: 0.02
    n_substeps: 20
    max_steps: 10000
  hooks:
    recorder: true
    tendon_debug: true
    tendon_debug_stride: 5
    show_live_tendon_panel: false
    live_tendon_panel_stride: 5
    viewer: mujoco
    keep_viewer_open: false
  artifacts:
    mujoco_pcc_diagnostics_stride: 10
    enabled: true
    save_npz: true
    save_plots: true
    save_gif: true
    save_mp4: true
    video_mode: live_mujoco
    video_fps: 10
    video_stride: 10
