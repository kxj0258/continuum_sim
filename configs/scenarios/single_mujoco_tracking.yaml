schema_version: 1
scenario:
  name: single_mujoco_tracking
  assembly_config_path: ../robots/assemblies/single_spatial.yaml
  backend:
    type: mujoco
    mujoco_config_path: ../mujoco_dual.yaml
    source_xml_path: ../../assets/mujoco/dual_three_segment_arm_tendon_with_visuals_mobile_base.xml
    generated_xml_path: ../../output/generated/scenario_single_tracking.xml
    retain_arm: executor
  scene: {}
  task:
    type: tracking
    waypoint_tolerance_m: 0.003
    target_advance_mode: tolerance
    loop: false
    tracking_control:
      approach_samples: 40
      executor_position_gain: 3.0
      observer_position_gain: 3.0
      feedforward_speed_mps: 0.0
      max_target_speed_mps: 0.030
      executor_tracking_weight: 100.0
      observer_tracking_weight: 40.0
      executor_collision_avoidance_weight: 80.0
      base_regularization_weight: 1.0
      tendon_regularization_weight: 0.2
      rank_tolerance: 1.0e-9
      minimum_singular_value: 1.0e-5
      nominal_damping: 1.0e-4
      maximum_damping: 5.0e-2
      minimum_velocity_scale: 0.05
      decouple_arm_singularity: true
    trajectory:
      type: square
      samples: 80
      radius_m: 0.018
      placement:
        center_mode: straight_tip_xy
        z_mode: straight_tip_minus_radius
        plane: xy
        yaw_deg: 15.0
      shape:
        side_length_m: 0.040
  runtime:
    controller_dt_s: 0.02
    n_substeps: 20
    max_steps: 5000
  hooks:
    recorder: true
    tendon_debug: true
    tendon_debug_stride: 5
    show_live_tendon_panel: true
    live_tendon_panel_stride: 5
    show_live_diagnostics_panel: true
    live_diagnostics_panel_stride: 5
    viewer: mujoco
    keep_viewer_open: false
  artifacts:
    save_gif: true
    video_mode: live_mujoco
    video_fps: 10
    video_stride: 10
