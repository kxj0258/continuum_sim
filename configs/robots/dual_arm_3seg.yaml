  # rotates about local Y (bending toward local X), then local X/Y alternate.
  # Executor and observer share this material-frame pattern across all 12 links.
  flexure_joint_axis_pattern:
    - [0.0, 1.0, 0.0]
    - [1.0, 0.0, 0.0]
