schema_version: 1
scenario:
  name: dual_analytic_tracking
  assembly_config_path: ../robots/assemblies/dual_spatial.yaml
  backend:
    type: analytic
  scene: {}
  task:
    type: tracking
    waypoint_tolerance_m: 0.001
    observer_roi_world: [0.010, 0.000, 0.135]
    loop: false
    waypoints_world:
      - [0.000, 0.010, 0.140]
      - [0.010, 0.010, 0.137]
      - [0.010, 0.020, 0.134]
  runtime:
    controller_dt_s: 0.02
    n_substeps: 1
    max_steps: 1000
  hooks:
    recorder: true
    tendon_debug: true
    tendon_debug_stride: 5
    viewer: matplotlib
    keep_viewer_open: true

