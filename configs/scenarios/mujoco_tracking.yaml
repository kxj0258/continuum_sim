schema_version: 1
scenario:
  name: mujoco_tracking
  arm_mode: dual
  low_level_control_path: ../control/mujoco_tracking_low_level.yaml
  backend:
    type: mujoco
    kinematics_mode: discrete_hinge
    mujoco_config_path: ../mujoco_dual.yaml
    source_xml_path: ../../assets/mujoco/dual_three_segment_arm_tendon_with_visuals_mobile_base.xml
    generated_xml_path: ../../output/generated/scenario_dual_tracking.xml
  scene: {}
  task:
    type: tracking
    waypoint_tolerance_m: 0.005
    target_advance_mode: tolerance
    observer_control_mode: collision_avoidance
    observer_control:
      minimum_distance_m: 0.010
      influence_distance_m: 0.019
      critical_distance_m: 0.008
      release_margin_m: 0.001
      avoidance_gain: 5.0
      collision_pair_count: 3
      collision_pair_index_separation: 1
      look_at_executor_tip: false
      look_at_gain: 1.0
      look_at_weight: 1.0
      look_at_distance_m: 0.005
      look_at_max_speed_mps: 0.005
      look_at_max_angular_speed_rad_s: 1.0
    loop: false
    tracking_control:
      approach_samples: 5
      tracking_mode: waypoint
      max_steps_per_waypoint: 500
      feedforward_speed_mps: 0.0
    trajectory:
      type: square
      samples: 20
      radius_m: 0.018
      placement:
        center_mode: straight_tcp_xy
        z_mode: straight_tcp_minus_radius
        plane: xy
        yaw_deg: 15.0
      shape:
        side_length_m: 0.040
  runtime:
    controller_dt_s: 0.02
    n_substeps: 20
    max_steps: 10000
  hooks:
    recorder: true
    tendon_debug: true
    tendon_debug_stride: 5
    show_live_tendon_panel: false
    live_tendon_panel_stride: 5
    show_live_task_error_panel: true
    live_task_error_panel_stride: 5
    live_task_error_panel_history_points: 600
    show_live_diagnostics_panel: false
    live_diagnostics_panel_stride: 5
    show_observer_camera: false
    observer_camera_stride: 1
    viewer: mujoco
    keep_viewer_open: false
  artifacts:
    mujoco_pcc_diagnostics_stride: 10
    save_gif: true
    save_mp4: true
    video_mode: live_mujoco
    video_fps: 10
    video_stride: 10
