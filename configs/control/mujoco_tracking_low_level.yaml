schema_version: 2
low_level_control:
  task_space_servo:
    position_gain: 1.0
    observer_position_gain: 1.0
    feedforward_gain: 1.0
    feedforward_speed_mps: 0.0
    max_speed_mps:
    enforce_speed_limit: false
  online_reachability:
    enabled: true
    auto_advance_enabled: true
    score_threshold: 0.5
    window_steps: 20
    min_steps_before_auto_advance: 50
    low_score_patience_steps: 20
    good_progress_mps: 0.001
    good_tendon_speed_ratio: 0.75
    good_alignment: 0.8
    bad_model_residual_mps: 0.005
  tendon_command:
    solver: weighted_svd
    executor_tracking_weight: 100.0
    observer_tracking_weight: 40.0
    collision_avoidance_weight: 80.0
    executor_orientation_tracking_mode: nullspace
    base_regularization_weight: 1.0
    tendon_regularization_weight: 0.8
    singularity_strategy: svd_projection
    rank_tolerance: 1.0e-9
    minimum_singular_value: 1.0e-5
    nominal_damping: 1.0e-3
    maximum_damping: 0.1
    minimum_velocity_scale: 0.05
    decouple_arm_singularity: true
    enforce_velocity_limits: false
    priority_stack:
      executor:
        - tasks: [position_servo]
        - tasks: [normal_force_control]
        - tasks: [orientation_servo]
        - tasks: [scene_avoidance]
      observer:
        - tasks: [interarm_avoidance]
        - tasks: [observer_tracking]
        - tasks: [look_at]
        - tasks: [scene_avoidance]
  execution:
    backend_adapter: mujoco_tendon_position
    target_policy: actual_anchored
    enforce_tendon_limits: false
    tendon_inner_loop:
      mode: bending_rate_servo
      rate_filter_time_constant_s: 0.04
      feedforward_lead_time_s: 0.02
      rate_proportional_time_s: 0.0
      rate_integral_gain: 0.1
      anti_windup_gain: 1.0
      enforce_target_lead_limit: false
      max_target_lead_m:
      soft_force_limit_n:
      hard_force_limit_n:
      zero_command_mode: hold
      zero_rate_tolerance_mps: 1.0e-7
