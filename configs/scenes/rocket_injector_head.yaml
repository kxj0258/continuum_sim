schema_version: 1
name: rocket_injector_head
description: Injector-head inspection scene with clustered posts and a shallow chamber shell.

builder:
  shell_approx_sides: 36
  shell_axial_slices: 4
  wall_thickness_m: 0.004
  geom_group: 0
  shell_rgba: [0.26, 0.35, 0.40, 0.32]
  obstacle_rgba: [0.90, 0.45, 0.16, 1.0]
  target_rgba: [0.10, 0.85, 0.50, 1.0]
  target_radius_m: 0.003
  contype: 1
  conaffinity: 1

scene:
  primitives:
    - id: injector_head_shell
      type: cylindrical_shell_segment
      z_min_m: 0.020
      z_max_m: 0.120
      radius_m: 0.065
      rgba: [0.26, 0.35, 0.40, 0.30]
    - id: central_injector_post
      type: cylinder_obstacle
      center_m: [0.0, 0.0, 0.050]
      radius_m: 0.010
      half_length_m: 0.020
      axis: z
      rgba: [0.84, 0.32, 0.11, 1.0]
    - id: injector_post_pos_x
      type: cylinder_obstacle
      center_m: [0.026, 0.0, 0.060]
      radius_m: 0.006
      half_length_m: 0.018
      axis: z
    - id: injector_post_neg_x
      type: cylinder_obstacle
      center_m: [-0.026, 0.0, 0.060]
      radius_m: 0.006
      half_length_m: 0.018
      axis: z
    - id: injector_post_pos_y
      type: cylinder_obstacle
      center_m: [0.0, 0.026, 0.060]
      radius_m: 0.006
      half_length_m: 0.018
      axis: z
    - id: injector_post_neg_y
      type: cylinder_obstacle
      center_m: [0.0, -0.026, 0.060]
      radius_m: 0.006
      half_length_m: 0.018
      axis: z

  inspection_targets:
    - id: injector_gap_a
      type: point
      pos_m: [0.018, 0.018, 0.075]
    - id: injector_gap_b
      type: point
      pos_m: [-0.018, 0.018, 0.080]
    - id: wall_after_posts
      type: wall_point
      section_id: injector_head_shell
      theta_deg: 250.0
      z_m: 0.105
      inward_offset_m: 0.018
