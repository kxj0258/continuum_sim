        out_z_m: 0.00933013
      - id: hole_03
        index: 2
        angle_deg: 60.0
        xy_m: [0.0025, 0.00433013]
        in_z_m: 0.00066987
        out_z_m: 0.00883975
      - id: hole_04
        index: 3
        angle_deg: 90.0
        xy_m: [0.0, 0.005]
        in_z_m: 0.0
        out_z_m: 0.00866025
      - id: hole_05
        index: 4
        angle_deg: 120.0
        xy_m: [-0.0025, 0.00433013]
        in_z_m: 0.00066987
        out_z_m: 0.00883975
      - id: hole_06
        index: 5
        angle_deg: 150.0
        xy_m: [-0.00433013, 0.0025]
        in_z_m: 0.00116025
        out_z_m: 0.00933013
      - id: hole_07
        index: 6
        angle_deg: 180.0
        xy_m: [-0.005, 0.0]
        in_z_m: 0.00133975
        out_z_m: 0.010
      - id: hole_08
        index: 7
        angle_deg: 210.0
        xy_m: [-0.00433013, -0.0025]
        in_z_m: 0.00116025
        out_z_m: 0.00933013
      - id: hole_09
        index: 8
        angle_deg: 240.0
        xy_m: [-0.0025, -0.00433013]
        in_z_m: 0.00066987
        out_z_m: 0.00883975
      - id: hole_10
        index: 9
        angle_deg: 270.0
        xy_m: [0.0, -0.005]
        in_z_m: 0.0
        out_z_m: 0.00866025
      - id: hole_11
        index: 10
        angle_deg: 300.0
        xy_m: [0.0025, -0.00433013]
        in_z_m: 0.00066987
        out_z_m: 0.00883975
      - id: hole_12
        index: 11
        angle_deg: 330.0
        xy_m: [0.00433013, -0.0025]
        in_z_m: 0.00116025
        out_z_m: 0.00933013

  base:
    description: >-
      Per-arm base tendon holes. Base z axis points downward.
      Base out_z base formula: 0 - abs(x)*tan15
    frame:
      origin: base_top_section_center
      z_axis: base_axis_down
    height_m: 0.020
    holes:
      - id: base_hole_01
        index: 0
        angle_deg: 0.0
        xy_m: [0.005, 0.0]
        in_z_m: -0.020
        out_z_m: -0.00133975
      - id: base_hole_02
        index: 1
        angle_deg: 30.0
        xy_m: [0.00433013, 0.0025]
        in_z_m: -0.020
        out_z_m: -0.00116025
      - id: base_hole_03
        index: 2
        angle_deg: 60.0
        xy_m: [0.0025, 0.00433013]
        in_z_m: -0.020
        out_z_m: -0.00066987
      - id: base_hole_04
        index: 3
        angle_deg: 90.0
        xy_m: [0.0, 0.005]
        in_z_m: -0.020
        out_z_m: 0.0
      - id: base_hole_05
        index: 4
        angle_deg: 120.0
        xy_m: [-0.0025, 0.00433013]
        in_z_m: -0.020
        out_z_m: -0.00066987
      - id: base_hole_06
        index: 5
