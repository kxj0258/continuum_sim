schema_version: 1
scenario:
  name: dual_engine_navigation
  assembly_config_path: ../robots/assemblies/dual_spatial_mobile.yaml
  backend:
    type: mujoco
    mujoco_config_path: ../mujoco_dual.yaml
    source_xml_path: ../../assets/mujoco/dual_three_segment_arm_tendon_with_visuals_mobile_base.xml
    generated_xml_path: ../../output/generated/scenario_dual_engine_navigation.xml
  scene:
    engine_config_path: ../scenes/engine_cleaning.yaml
  task:
    type: engine_navigation
    waypoint_tolerance_m: 0.003
    min_clearance_m: 0.010
    terminate_on_clearance_violation: true
    engine_navigation:
      entry_region: entry_port
      insertion_path: nozzle_axis_entry
      pre_entry_standoff_m: 0.050
      insertion_waypoint_spacing_m: 0.020
      base_position_tolerance_m: 0.005
      base_orientation_tolerance_rad: 0.035
      base_position_gain: 1.5
      base_orientation_gain: 2.0
      phase_timeout_steps: 5000
      local_path:
        type: transverse_square
        radius_m: 0.010
        samples: 40
  runtime:
    controller_dt_s: 0.02
    n_substeps: 20
    max_steps: 8000
  hooks:
    recorder: true
    tendon_debug: true
    tendon_debug_stride: 5
    show_live_tendon_panel: true
    live_tendon_panel_stride: 5
    viewer: mujoco
    keep_viewer_open: true
  artifacts:
    enabled: true
    save_npz: true
    save_plots: true
    save_gif: true
    video_mode: live_mujoco
    video_fps: 10
    video_stride: 10
