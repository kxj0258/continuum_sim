schema_version: 1
scenario:
  name: single_engine_cleaning
  assembly_config_path: ../robots/assemblies/single_spatial.yaml
  backend:
    type: mujoco
    mujoco_config_path: ../mujoco_dual.yaml
    source_xml_path: ../../assets/mujoco/dual_three_segment_arm_tendon_with_visuals_mobile_base.xml
    generated_xml_path: ../../output/generated/scenario_single_engine_cleaning.xml
    retain_arm: executor
  scene:
    engine_config_path: ../scenes/engine_cleaning.yaml
  task:
    type: engine_cleaning
    waypoint_tolerance_m: 0.002
    target_advance_mode: tolerance
    wiping_control_type: hybrid_force_position
    target_contact_distance_m: 0.0
    contact_tolerance_m: 0.003
    target_normal_force_n: 1.2
    normal_force_gain: 0.04
    engine_cleaning:
      region_name: cleaning_patch
      num_passes_u: 4
      num_passes_v: 3
      approach_distance_m: 0.015
      retreat_distance_m: 0.020
      target_force_n: 1.2
      standoff_distance_m: 0.005
      snake_pattern: true
  runtime:
    controller_dt_s: 0.02
    n_substeps: 20
    max_steps: 2000
  hooks:
    recorder: true
    tendon_debug: true
    tendon_debug_stride: 5
    show_live_tendon_panel: true
    live_tendon_panel_stride: 5
    show_live_force_panel: false
    viewer: mujoco
    keep_viewer_open: true
