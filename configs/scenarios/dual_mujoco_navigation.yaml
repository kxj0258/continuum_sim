schema_version: 1
scenario:
  name: dual_mujoco_navigation
  assembly_config_path: ../robots/assemblies/dual_spatial.yaml
  low_level_control_path: ../control/mujoco_direct_task_low_level.yaml
  backend:
    type: mujoco
    mujoco_config_path: ../mujoco_dual.yaml
    source_xml_path: ../../assets/mujoco/dual_three_segment_arm_tendon_with_visuals_mobile_base.xml
    generated_xml_path: ../../output/generated/scenario_dual_navigation.xml
  scene:
    structured_config_path: ../scenes/rocket_nozzle_entry.yaml
  task:
    type: navigation
    observer_control_mode: collision_avoidance
    observer_control:
      minimum_distance_m: 0.010
      influence_distance_m: 0.018
      critical_distance_m: 0.008
      release_margin_m: 0.002
      avoidance_gain: 1.2
    waypoint_tolerance_m: 0.005
    min_clearance_m: 0.010
    terminate_on_clearance_violation: true
    observer_roi_world: [0.025, -0.022, 0.095]
    waypoints_world:
      - [0.055, 0.032, 0.075]
      - [0.025, -0.022, 0.095]
      - [-0.039, -0.023, 0.110]
  runtime:
    controller_dt_s: 0.02
    n_substeps: 20
    max_steps: 2000
  hooks:
    recorder: true
    tendon_debug: true
    tendon_debug_stride: 5
    show_live_tendon_panel: true
    live_tendon_panel_stride: 5
    viewer: mujoco
    keep_viewer_open: false
  artifacts:
    enabled: true
    save_npz: true
    save_plots: true
    save_gif: true
    video_mode: live_mujoco
    video_fps: 10
    video_stride: 10
