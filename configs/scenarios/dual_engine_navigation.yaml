schema_version: 1
scenario:
  name: dual_engine_navigation
  assembly_config_path: ../robots/assemblies/dual_spatial_mobile.yaml
  low_level_control_path: ../control/mujoco_tracking_low_level.yaml
  backend:
    type: mujoco
    kinematics_mode: discrete_hinge
    mujoco_config_path: ../mujoco_dual.yaml
    source_xml_path: ../../assets/mujoco/dual_three_segment_arm_tendon_with_visuals_mobile_base.xml
    generated_xml_path: ../../output/generated/scenario_dual_engine_navigation.xml
  scene:
    engine_config_path: ../scenes/engine_cleaning.yaml
  task:
    type: engine_navigation
    observer_control_mode: collision_avoidance
    observer_control:
      minimum_distance_m: 0.010
      influence_distance_m: 0.018
      critical_distance_m: 0.008
      release_margin_m: 0.002
      avoidance_gain: 1.2
    waypoint_tolerance_m: 0.003
    min_clearance_m: 0.010
    terminate_on_clearance_violation: true
    engine_navigation:
      entry_region: entry_port
      insertion_path: nozzle_axis_entry
      pre_entry_standoff_m: 0.050
      insertion_waypoint_spacing_m: 0.020
      base_position_tolerance_m: 0.005
      base_orientation_tolerance_rad: 0.035
      base_position_gain: 1.5
      base_orientation_gain: 2.0
      phase_timeout_steps: 5000
      local_tracking:
        advance_mode: time # tolerance, time, or steps
        waypoint_tolerance_m: 0.005
        rejoin_tolerance_m: 0.005
        advance_time_s: 0.20
        transition_samples: 20
        executor_position_gain: 1.5
        max_target_speed_mps: 0.015
        enforce_tendon_rate_limits: false
      observer_control:
        position_gain: 3.0
        executor_offset_world_m: [0.0, -0.04, 0.02]
        roi_blend: 0.25
        inter_arm_influence_distance_m: 0.018
        inter_arm_safe_distance_m: 0.010
        inter_arm_critical_distance_m: 0.008
        inter_arm_release_margin_m: 0.002
        inter_arm_avoidance_gain: 1.2
        centerline_samples_per_segment: 6
        observer_tracking_weight: 20.0
        observer_collision_weight: 80.0
        stop_all_on_critical_distance: false
      intermediate_local_paths:
        - name: one_third_circle
          at_fraction: 0.3333333333
          type: transverse_circle
          radius_m: 0.035
          samples: 60
          axial_retraction_m: 0.025
        - name: two_thirds_ellipse
          at_fraction: 0.6666666667
          type: ellipse
          radius_m: 0.035
          shape:
            radius_x_m: 0.035
            radius_y_m: 0.020
          samples: 60
          axial_retraction_m: 0.025
      local_path:
        name: endpoint_square
        type: transverse_square
        radius_m: 0.030
        samples: 60
        axial_retraction_m: 0.025
  runtime:
    controller_dt_s: 0.02
    n_substeps: 20
    max_steps: 8000
  hooks:
    recorder: true
    tendon_debug: true
    tendon_debug_stride: 5
    show_live_tendon_panel: true
    live_tendon_panel_stride: 5
    show_live_diagnostics_panel: true
    live_diagnostics_panel_stride: 5
    viewer: mujoco
    keep_viewer_open: false
  artifacts:
    mujoco_pcc_diagnostics_stride: 10
    enabled: true
    save_npz: true
    save_plots: true
    save_gif: true
    video_mode: live_mujoco
    video_fps: 10
    video_stride: 10
