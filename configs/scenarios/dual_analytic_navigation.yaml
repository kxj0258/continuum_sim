schema_version: 1
scenario:
  name: dual_analytic_navigation
  assembly_config_path: ../robots/assemblies/dual_spatial.yaml
  low_level_control_path: ../control/spatial_low_level.yaml
  backend:
    type: analytic
  scene:
    structured_config_path: ../scenes/rocket_nozzle_entry.yaml
  task:
    type: navigation
    waypoint_tolerance_m: 0.005
    min_clearance_m: 0.010
    terminate_on_clearance_violation: true
    observer_roi_world: [0.025, -0.022, 0.095]
    loop: false
    waypoints_world:
      - [0.055, 0.032, 0.075]
      - [0.025, -0.022, 0.095]
      - [-0.039, -0.023, 0.110]
  runtime:
    controller_dt_s: 0.02
    n_substeps: 1
    max_steps: 2000
  hooks:
    recorder: true
    tendon_debug: false
    viewer: matplotlib
    keep_viewer_open: true
  artifacts:
    enabled: true
    save_npz: true
    save_plots: true
    save_gif: true
