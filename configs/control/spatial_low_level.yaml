schema_version: 2
low_level_control:
  task_space_servo:
    position_gain: 1.5
    observer_position_gain: 1.5
    feedforward_gain: 1.0
    feedforward_speed_mps: 0.0
    max_speed_mps: 0.015
    enforce_speed_limit: true
  tendon_command:
    solver: weighted_svd
    executor_tracking_weight: 100.0
    observer_tracking_weight: 40.0
    collision_avoidance_weight: 80.0
    base_regularization_weight: 1.0
    tendon_regularization_weight: 0.5
    singularity_strategy: svd_projection
    rank_tolerance: 1.0e-9
    minimum_singular_value: 1.0e-5
    nominal_damping: 1.0e-3
    maximum_damping: 5.0e-2
    minimum_velocity_scale: 0.05
    decouple_arm_singularity: true
    enforce_velocity_limits: true
  execution:
    backend_adapter: compatible_rate_integrator
    target_policy: protected
    enforce_tendon_limits: true
