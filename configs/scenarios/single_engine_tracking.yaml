schema_version: 1
scenario:
  name: single_spatial_engine_tracking
  assembly_config_path: ../robots/assemblies/single_spatial_mobile.yaml
  low_level_control_path: ../control/mujoco_tracking_low_level.yaml
  backend:
    type: mujoco
    mujoco_config_path: ../mujoco_dual.yaml
    source_xml_path: ../../assets/mujoco/dual_three_segment_arm_tendon_with_visuals_mobile_base.xml
    generated_xml_path: ../../output/generated/scenario_single_engine.xml
    retain_arm: executor
  scene:
    engine_config_path: ../scenes/engine_cleaning.yaml
  task:
    type: tracking
    waypoint_tolerance_m: 0.002
    loop: false
    tracking_control:
      approach_samples: 0
      tracking_mode: time
      trajectory_duration_s: 80.0
      stage_mobile_base: true
      base_position_gain: 1.5
      base_orientation_gain: 2.0
      base_position_tolerance_m: 0.005
      base_orientation_tolerance_rad: 0.035
    waypoints_world:
      - [0.100, 0.450, 0.080]
      - [0.115, 0.500, 0.060]
  runtime:
    controller_dt_s: 0.02
    n_substeps: 20
    max_steps: 6500
  hooks:
    recorder: true
    tendon_debug: true
    tendon_debug_stride: 5
    show_live_tendon_panel: true
    live_tendon_panel_stride: 5
    viewer: mujoco
    keep_viewer_open: false
  artifacts:
    enabled: true
    save_npz: true
    save_plots: true
    save_gif: true
    video_mode: live_mujoco
    video_fps: 10
    video_stride: 10
