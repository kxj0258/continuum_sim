schema_version: 1
scenario:
  name: dual_mujoco_wiping
  assembly_config_path: ../robots/assemblies/dual_spatial.yaml
  low_level_control_path: ../control/mujoco_tracking_low_level.yaml
  backend:
    type: mujoco
    kinematics_mode: discrete_hinge
    mujoco_config_path: ../mujoco_dual.yaml
    source_xml_path: ../../assets/mujoco/dual_three_segment_arm_tendon_with_visuals_mobile_base.xml
    generated_xml_path: ../../output/generated/scenario_dual_wiping.xml
  scene:
    structured_config_path: ../scenes/wiping_board.yaml
  task:
    type: wiping
    observer_control_mode: collision_avoidance
    observer_control:
      minimum_distance_m: 0.010
      influence_distance_m: 0.018
      critical_distance_m: 0.008
      release_margin_m: 0.002
      avoidance_gain: 1.2
    waypoint_tolerance_m: 0.003
    observer_roi_world: [0.0375, 0.000, 0.095]
    surface_normal_world: [-1.0, 0.0, 0.0]
    target_contact_distance_m: 0.0
    contact_tolerance_m: 0.002
    tracking_control:
      approach_samples: 30
      tracking_mode: time
      trajectory_duration_s: 20.0
    waypoints_world:
      - [0.0425, -0.020, 0.0825]
      - [0.0350, -0.020, 0.0825]
      - [0.0350, 0.020, 0.0825]
      - [0.0350, 0.020, 0.0950]
      - [0.0350, -0.020, 0.0950]
      - [0.0425, -0.020, 0.0950]
  runtime:
    controller_dt_s: 0.02
    n_substeps: 20
    max_steps: 2000
  hooks:
    recorder: true
    tendon_debug: true
    tendon_debug_stride: 5
    show_live_tendon_panel: true
    live_tendon_panel_stride: 5
    viewer: mujoco
    keep_viewer_open: false
  artifacts:
    mujoco_pcc_diagnostics_stride: 10
    enabled: true
    save_npz: true
    save_plots: true
    save_gif: true
    save_mp4: true
    video_mode: live_mujoco
    video_fps: 10
    video_stride: 10
