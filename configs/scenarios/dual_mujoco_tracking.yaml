schema_version: 1
scenario:
  name: dual_mujoco_tracking
  assembly_config_path: ../robots/assemblies/dual_spatial.yaml
  low_level_control_path: ../control/mujoco_tracking_low_level.yaml
  backend:
    type: mujoco
    mujoco_config_path: ../mujoco_dual.yaml
    source_xml_path: ../../assets/mujoco/dual_three_segment_arm_tendon_with_visuals_mobile_base.xml
    generated_xml_path: ../../output/generated/scenario_dual_tracking.xml
  scene: {}
  task:
    type: tracking
    waypoint_tolerance_m: 0.003
    target_advance_mode: tolerance
    observer_control_mode: collision_avoidance
    observer_control:
      minimum_distance_m: 0.010
      influence_distance_m: 0.018
      critical_distance_m: 0.008
      release_margin_m: 0.002
      avoidance_gain: 1.2
    loop: false
    tracking_control:
      approach_samples: 40
      tracking_mode: time
      trajectory_duration_s: 30.0
    trajectory:
      type: square
      samples: 80
      radius_m: 0.018
      placement:
        center_mode: straight_tip_xy
        z_mode: straight_tip_minus_radius
        plane: xy
        yaw_deg: 15.0
      shape:
        side_length_m: 0.040
  runtime:
    controller_dt_s: 0.02
    n_substeps: 20
    max_steps: 5000
  hooks:
    recorder: true
    tendon_debug: true
    tendon_debug_stride: 5
    show_live_tendon_panel: true
    live_tendon_panel_stride: 5
    show_live_diagnostics_panel: true
    live_diagnostics_panel_stride: 5
    viewer: mujoco
    keep_viewer_open: false
  artifacts:
    save_gif: true
    video_mode: live_mujoco
    video_fps: 10
    video_stride: 10
