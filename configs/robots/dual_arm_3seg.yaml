schema_version: 1
name: dual_three_segment_spatial_tendon_continuum_arm

units:
  system: SI
  length: m
  mass: kg
  force: N
  angle: deg
  stiffness: N_m2

dual_robot:
  type: dual_spatial_tendon_driven_continuum_arm
  shared_base_frame: dual_mobile_base
  default_arm: executor
  total_tendon_count: 18
  total_motor_count: 18
  tendons_per_arm: 9
  tendons_per_segment: 3
