schema_version: 1
scenario:
  name: single_mujoco_navigation
  assembly_config_path: ../robots/assemblies/single_spatial.yaml
  backend:
    type: mujoco
    mujoco_config_path: ../mujoco_dual.yaml
    source_xml_path: ../../assets/mujoco/dual_three_segment_arm_tendon_with_visuals_mobile_base.xml
    generated_xml_path: ../../output/generated/scenario_single_navigation.xml
    retain_arm: executor
  scene:
    structured_config_path: ../scenes/rocket_nozzle_entry.yaml
  task:
    type: navigation
    waypoint_tolerance_m: 0.002
    min_clearance_m: 0.010
    terminate_on_clearance_violation: true
    waypoints_world:
      - [0.055, 0.032, 0.075]
      - [0.025, -0.022, 0.095]
      - [-0.039, -0.023, 0.110]
  runtime:
    controller_dt_s: 0.02
    n_substeps: 20
    max_steps: 2000
  hooks:
    recorder: true
    tendon_debug: true
    tendon_debug_stride: 5
    viewer: mujoco
    keep_viewer_open: true

