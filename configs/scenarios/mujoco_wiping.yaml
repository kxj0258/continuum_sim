schema_version: 1
scenario:
  name: mujoco_wiping
  arm_mode: dual
  low_level_control_path: ../control/mujoco_tracking_low_level.yaml
  backend:
    type: mujoco
    kinematics_mode: discrete_hinge
    mujoco_config_path: ../mujoco_dual.yaml
    source_xml_path: ../../assets/mujoco/dual_three_segment_arm_tendon_with_visuals_mobile_base.xml
    generated_xml_path: ../../output/generated/scenario_dual_wiping.xml
  scene:
    structured_config_path: ../scenes/wiping_board.yaml
  task:
    type: wiping
    observer_control_mode: collision_avoidance
    observer_control:
      minimum_distance_m: 0.010
      influence_distance_m: 0.019
      critical_distance_m: 0.008
      release_margin_m: 0.001
      avoidance_gain: 5.0
      collision_pair_count: 3
      collision_pair_index_separation: 1
      look_at_executor_tip: false
      look_at_gain: 1.0
      look_at_weight: 1.0
      look_at_distance_m: 0.005
      look_at_max_speed_mps: 0.005
      look_at_max_angular_speed_rad_s: 1.0
    waypoint_tolerance_m: 0.005
    target_advance_mode: tolerance
    wiping_control_type: hybrid_force_position
    observer_roi_world: [0.0275, 0.005, 0.105]
    surface_normal_world: [-1.0, 0.0, 0.0]
    target_contact_distance_m: -0.0025
    contact_tolerance_m: 0.002
    target_normal_force_n: 1.5
    normal_force_gain: 0.04
    force_feedback_mode: proxy_distance
    force_proxy_stiffness_n_m: 600.0
    max_normal_velocity_m_s: 0.03
    force_control_weight: 80.0
    max_contact_force_n: 5.0
    contact_loss_tolerance_steps: 100
    scene_avoidance:
      enabled: true
      executor_mode: disabled
      observer_mode: nullspace_after_interarm_lookat
      engine_min_clearance_m: 0.003
      engine_influence_distance_m: 0.010
      engine_avoidance_gain: 5.0
    tracking_control:
      approach_samples: 30
      tracking_mode: waypoint
      max_steps_per_waypoint: 400
      feedforward_speed_mps: 0.0
    wiping_path:
      surface_id: board_surface
      patch_id: center_patch
      center_m: [0.0375, 0.005, 0.105]
      width_m: 0.040
      height_m: 0.025
      line_count: 5
      samples_per_line: 30
      approach_reference: first_contact
      approach_offset_m: 0.005
      contact_offset_m: -0.0025
  runtime:
    controller_dt_s: 0.02
    n_substeps: 20
    max_steps: 10000
  hooks:
    recorder: true
    tendon_debug: true
    tendon_debug_stride: 5
    show_live_tendon_panel: true
    live_tendon_panel_stride: 5
    viewer: mujoco
    keep_viewer_open: false
  artifacts:
    mujoco_pcc_diagnostics_stride: 10
    enabled: true
    save_npz: true
    save_plots: true
    save_gif: true
    save_mp4: true
    video_mode: live_mujoco
    video_fps: 10
    video_stride: 10
