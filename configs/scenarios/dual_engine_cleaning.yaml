schema_version: 1
scenario:
  name: dual_engine_cleaning
  assembly_config_path: ../robots/assemblies/dual_spatial_mobile.yaml
  low_level_control_path: ../control/mujoco_tracking_low_level.yaml
  backend:
    type: mujoco
    kinematics_mode: discrete_hinge
    mujoco_config_path: ../mujoco_dual.yaml
    source_xml_path: ../../assets/mujoco/dual_three_segment_arm_tendon_with_visuals_mobile_base.xml
    generated_xml_path: ../../output/generated/scenario_dual_engine_cleaning.xml
  scene:
    engine_config_path: ../scenes/engine_cleaning.yaml
  task:
    type: engine_cleaning
    observer_control_mode: collision_avoidance
    observer_control:
      minimum_distance_m: 0.010
      influence_distance_m: 0.018
      critical_distance_m: 0.008
      release_margin_m: 0.002
      avoidance_gain: 1.2
    waypoint_tolerance_m: 0.002
    target_advance_mode: tolerance
    observer_roi_world: [0.114155, 0.530382, 0.010]
    target_contact_distance_m: 0.0
    contact_tolerance_m: 0.003
    target_normal_force_n: 1.2
    normal_force_gain: 0.04
    engine_cleaning_control:
      tangential_position_gain: 8.0
      normal_position_gain: 3.0
      normal_force_gain: 0.001
      approach_position_gain: 5.0
      retreat_position_gain: 5.0
      max_tcp_speed_mps: 0.03
      max_normal_speed_mps: 0.01
      waypoint_tolerance_m: 0.002
      max_contact_force_n: 5.0
      force_deadband_n: 0.05
    engine_cleaning:
      region_name: cleaning_patch
      num_passes_u: 4
      num_passes_v: 3
      approach_distance_m: 0.015
      retreat_distance_m: 0.020
      target_force_n: 1.2
      standoff_distance_m: 0.005
      snake_pattern: true
  runtime:
    controller_dt_s: 0.02
    n_substeps: 20
    max_steps: 4000
  hooks:
    recorder: true
    tendon_debug: true
    tendon_debug_stride: 5
    show_live_tendon_panel: true
    live_tendon_panel_stride: 5
    show_live_force_panel: false
    viewer: mujoco
    keep_viewer_open: false
  artifacts:
    mujoco_pcc_diagnostics_stride: 10
    enabled: true
    save_npz: true
    save_plots: true
    save_gif: true
    video_mode: live_mujoco
    video_fps: 10
    video_stride: 10
